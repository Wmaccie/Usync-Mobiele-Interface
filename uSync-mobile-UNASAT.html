<style>
  :root{
    --navy:#00126B;
    --navy-deep:#000d4a;
    --navy2:#0B2A6B;
    --blue:#3860B2;
    --orange:#E66A00;
    --orange-soft:#FBBC9F;
    --orange-softer:#FDDECF;
    --bg:#F2F4F9;
    --card:#FFFFFF;
    --line:#E4E8F1;
    --gray:#A6A6A6;
    --gray2:#8A8A8A;
    --text:#141726;
    --text-mute:#6B6F80;
    --green:#2E7D32;
    --green-bg:#E8F5E9;
    --red:#C62828;
    --red-bg:#FFEBEE;
    --amber:#B8860B;
    --amber-bg:#FFF3DC;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(11,15,45,.04), 0 6px 20px -8px rgba(11,15,45,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#DDE3F0;}
  body{
    font-family:'Open Sans',system-ui,-apple-system,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ---------- App shell / phone frame ---------- */
  #app-outer{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
  }
  @media (min-width:560px){
    #app-outer{ padding:28px 12px; background:
      radial-gradient(1200px 700px at 15% -10%, #eef1fb 0%, #DDE3F0 55%); }
  }
  #phone{
    width:100%;
    max-width:428px;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:560px){
    #phone{
      height:calc(100vh - 56px);
      height:calc(100dvh - 56px);
      max-height:920px;
      border-radius:38px;
      box-shadow:0 30px 60px -20px rgba(0,10,60,.35), 0 0 0 10px #0b0f1a, 0 0 0 12px #2a2f3a;
    }
  }
  #view-area{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    position:relative;
    padding-bottom:12px;
  }
  #view-area::-webkit-scrollbar{width:0;}

  .screen{display:none;}
  .screen.active{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding:16px 18px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{display:flex; align-items:center; gap:9px;}
  .brand img{width:26px; height:26px; display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.05;}
  .brand-text b{font-size:15.5px; font-weight:800; letter-spacing:.2px;}
  .brand-text span{font-size:9.5px; letter-spacing:1.2px; color:#AEB8E8; font-weight:700; text-transform:uppercase;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.12); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    position:relative;
  }
  .icon-btn svg{width:17px; height:17px;}
  .dot-badge{
    position:absolute; top:3px; right:4px; width:8px; height:8px; border-radius:50%;
    background:var(--orange); border:1.5px solid var(--navy-deep);
  }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--orange);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12px; color:#fff; cursor:pointer; border:none;
    letter-spacing:.3px;
  }

  /* Portal sub-header for role name (Lecturer/Finance/GradesAdmin/Admin) */
  .portal-tag{
    display:inline-block; margin-top:2px; font-size:9.5px; font-weight:800;
    letter-spacing:1.1px; color:#AEB8E8; text-transform:uppercase;
  }

  /* Page heading block under topbar */
  .page-head{padding:18px 18px 6px;}
  .page-head h1{font-size:20px; margin:0 0 2px; font-weight:800; color:var(--navy);}
  .page-head p{margin:0; font-size:12.5px; color:var(--text-mute);}
  .page-head .greeting-name{color:var(--orange);}

  .content{padding:12px 16px 90px;}

  /* ---------- Stat grid ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-grid.cols-4{grid-template-columns:1fr 1fr;}
  .stat-card{
    background:var(--card); border-radius:var(--radius-sm); padding:13px 14px;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .stat-card .stat-label{
    font-size:9.8px; font-weight:800; letter-spacing:.9px; color:var(--gray2); text-transform:uppercase;
  }
  .stat-card .stat-value{
    font-size:23px; font-weight:800; color:var(--navy); margin:5px 0 1px; line-height:1;
  }
  .stat-card .stat-sub{font-size:11px; color:var(--text-mute);}
  .stat-card.accent-orange .stat-value{color:var(--orange);}
  .stat-card.accent-green .stat-value{color:var(--green);}
  .stat-card.accent-red .stat-value{color:var(--red);}
  .stat-card.accent-blue .stat-value{color:var(--blue);}

  /* ---------- Section cards ---------- */
  .card{
    background:var(--card); border-radius:var(--radius); padding:15px;
    box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:14px;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .card-title{
    font-size:11px; font-weight:800; letter-spacing:.9px; color:var(--navy); text-transform:uppercase;
  }
  .card-link{font-size:12px; font-weight:700; color:var(--blue);}

  /* ---------- Rows / list items ---------- */
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none; padding-bottom:2px;}
  .row-main{min-width:0;}
  .row-title{font-size:13.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:11.5px; color:var(--text-mute); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-end{text-align:right; flex-shrink:0;}
  .row-val{font-size:14px; font-weight:800; color:var(--navy);}

  .chevron{color:var(--gray); flex-shrink:0;}
  .chevron svg{width:14px; height:14px; display:block;}

  /* ---------- Badges ---------- */
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800;
    padding:3.5px 9px; border-radius:999px; letter-spacing:.2px; white-space:nowrap;
  }
  .badge-green{background:var(--green-bg); color:var(--green);}
  .badge-red{background:var(--red-bg); color:var(--red);}
  .badge-orange{background:var(--orange-softer); color:#B3500A;}
  .badge-blue{background:#E7EDFA; color:var(--blue);}
  .badge-amber{background:var(--amber-bg); color:var(--amber);}
  .badge-gray{background:#EEF0F5; color:var(--text-mute);}
  .badge-navy{background:#E4E8F8; color:var(--navy);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:11px; font-weight:700; font-size:13.5px; padding:11px 16px;
    cursor:pointer; border:none; width:100%;
  }
  .btn-primary{background:var(--orange); color:#fff;}
  .btn-primary:active{background:#c95c00;}
  .btn-outline{background:#fff; border:1.5px solid var(--navy); color:var(--navy);}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-ghost{background:#EEF0F5; color:var(--navy);}
  .btn-sm{width:auto; padding:7px 12px; font-size:12px; border-radius:9px;}
  .btn-danger-outline{background:#fff; border:1.5px solid var(--red); color:var(--red);}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}

  /* ---------- Progress bar ---------- */
  .progress-track{background:#EDEFF6; border-radius:999px; height:8px; overflow:hidden; margin:6px 0;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--navy));}
  .progress-fill.orange{background:linear-gradient(90deg,var(--orange),#c95c00);}
  .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-mute); margin-top:4px;}

  /* ---------- Inputs ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; font-weight:800; color:var(--navy); letter-spacing:.4px; text-transform:uppercase; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:13.5px; background:#fff; color:var(--text);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
    border-radius:11px; padding:9px 12px; margin-bottom:12px;
  }
  .search-box svg{width:15px; height:15px; color:var(--gray); flex-shrink:0;}
  .search-box input{border:none; outline:none; flex:1; font-size:13.5px; background:transparent;}

  /* ---------- Chip filter row ---------- */
  .chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 13px; border-radius:999px; font-size:12px; font-weight:700;
    background:#fff; border:1.5px solid var(--line); color:var(--text-mute); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:28px 14px; color:var(--text-mute);
  }
  .empty-state svg{width:34px; height:34px; color:var(--gray); margin-bottom:8px;}
  .empty-state p{margin:0; font-size:12.5px;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    display:flex; background:#fff; border-top:1px solid var(--line);
    position:sticky; bottom:0; z-index:20;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 2px 8px; background:none; border:none; cursor:pointer; color:var(--gray2);
  }
  .nav-item svg{width:19px; height:19px;}
  .nav-item span{font-size:9.5px; font-weight:700; letter-spacing:.1px;}
  .nav-item.active{color:var(--navy);}
  .nav-item.active svg{color:var(--orange);}

  /* ---------- Sheet (bottom modal) ---------- */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(6,10,35,.45); z-index:40;
    display:none; align-items:flex-end;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:#fff; width:100%; border-radius:20px 20px 0 0; padding:10px 18px 22px;
    animation:slideUp .2s ease;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0));
  }
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:6px auto 14px;}
  .sheet-item{
    display:flex; align-items:center; gap:12px; padding:12px 4px; font-size:14px; font-weight:700;
    color:var(--text); border-bottom:1px solid var(--line); cursor:pointer;
  }
  .sheet-item:last-child{border-bottom:none;}
  .sheet-item svg{width:18px; height:18px; color:var(--navy); flex-shrink:0;}
  .sheet-item.danger{color:var(--red);}
  .sheet-item.danger svg{color:var(--red);}
  .sheet-title{font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--gray2); padding:2px 4px 6px;}

  /* generic icon sizing helper */
  svg{stroke:currentColor; width:20px; height:20px; flex-shrink:0; display:inline-block; vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app-outer"><div id="phone">
  <div id="view-area"></div>
  <div class="bottom-nav" id="bottomnav" style="display:none;"></div>
  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet();">
    <div class="sheet" id="sheetContent"></div>
  </div>
</div></div>

/* ============================== SMALL HELPERS ============================== */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function statCard(label,value,sub,accent){
  return `<div class="stat-card ${accent?'accent-'+accent:''}">
    <div class="stat-label">${esc(label)}</div>
    <div class="stat-value">${esc(value)}</div>
    <div class="stat-sub">${esc(sub||'')}</div>
  </div>`;
}
function statGrid(items){ return `<div class="stat-grid">${items.map(i=>statCard(i.label,i.value,i.sub,i.accent)).join('')}</div>`; }

function badge(text,kind){ return `<span class="badge badge-${kind||'gray'}">${esc(text)}</span>`; }

function row({title,sub,right,rightSub,onclick,badgeHtml}){
  return `<div class="row" ${onclick?`style="cursor:pointer" onclick="${onclick}"`:''}>
    <div class="row-main">
      <div class="row-title">${esc(title)}</div>
      ${sub?`<div class="row-sub">${esc(sub)}</div>`:''}
    </div>
    <div class="row-end" style="display:flex;align-items:center;gap:8px;">
      ${badgeHtml?badgeHtml:(right!=null?`<div><div class="row-val">${esc(right)}</div>${rightSub?`<div class="row-sub">${esc(rightSub)}</div>`:''}</div>`:'')}
      ${onclick?`<span class="chevron">${I.chevron}</span>`:''}
    </div>
  </div>`;
}

function card(titleHtml, innerHtml, linkText, linkOnclick){
  return `<div class="card">
    <div class="card-head">
      <div class="card-title">${titleHtml}</div>
      ${linkText?`<a class="card-link" onclick="${linkOnclick}" style="cursor:pointer">${esc(linkText)}</a>`:''}

}

function gradeBadge(status){
  const map = {
    released:["Released","green"], pending:["Pending","amber"], published:["Published","green"],
    cleared:["Cleared","green"], plan:["Payment Plan","blue"], overdue:["Overdue","red"], notcleared:["Not Cleared","red"],
    active:["Active","green"], open:["Open","amber"], done:["Done","green"], missed:["Missed","red"],
    upcoming:["Upcoming","blue"], ontime:["On time","green"], blocked:["Blocked","red"],
  };
  const m = map[status]||[status,"gray"];
  return badge(m[0],m[1]);
}

/* ============================== ROUTER ============================== */
function chooseRole(role){
  STATE.role = role;
  const first = NAV[role][0].id;
  goto(role, first);
}
function showLogin(){
  STATE.role = null;
  document.getElementById('bottomnav').style.display='none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-login').classList.add('active');
  document.getElementById('view-area').scrollTop = 0;
}
function goto(role, screenId){
  STATE.role = role; STATE.screen = screenId;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById('scr-'+screenId);
  if(el) el.classList.add('active');
  renderBottomNav();
  document.getElementById('view-area').scrollTop = 0;
  closeSheet();
}
function renderBottomNav(){
  const bn = document.getElementById('bottomnav');
  if(!STATE.role){ bn.style.display='none'; return; }
  bn.style.display='flex';
  const moreScreens = ['admin-applications','admin-enrollment','admin-planning'];
  bn.innerHTML = NAV[STATE.role].map(item=>{
    const isMore = item.id==='admin-more';
    const isActive = isMore ? moreScreens.includes(STATE.screen) : STATE.screen===item.id;
    const action = isMore ? `adminMoreSheet()` : `goto('${STATE.role}','${item.id}')`;
    return `<button class="nav-item ${isActive?'active':''}" onclick="${action}">${item.icon}<span>${item.label}</span></button>`;
  }).join('');
}

/* ============================== BOOT ============================== */
function assembleScreens(){
  const parts = [
    screenSplash(), screenLogin(),
    screenStudentDashboard(), screenStudentGrades(), screenStudentSchedule(), screenStudentProgress(),
    screenStudentDocuments(), screenStudentProfile(), screenStudentTasks(), screenStudentSupport(), screenStudentNotifications(),
    screenLecturerDashboard(), screenLecturerGrades(), screenLecturerStudents(), screenLecturerFeedback(), screenLecturerSchedule(), screenLecturerReport(),
    screenFinanceDashboard(), screenFinancePlans(), screenFinanceClearance(), screenFinanceAudit(),
    screenGaValidate(), screenGaReports(), screenGaPublished(), screenGaCerts(),
    screenAdminHome(), screenAdminStudents(), screenAdminFinance(), screenAdminRequests(),
    screenAdminApplications(), screenAdminEnrollment(), screenAdminPlanning(),
  ];
  document.getElementById('view-area').innerHTML = parts.join('');
}

function init(){
  assembleScreens();
  setTimeout(()=>{ showLogin(); }, 1600);
}
window.addEventListener('DOMContentLoaded', init);

        {label:"Overall Average", value:"7.1", sub:"All subjects", accent:"blue"},
        {label:"EC Completed", value:"612", sub:"Across my students", accent:"green"},
      ])}
      ${searchBox("Search student name or ID...")}
      ${card("Grades in my subjects", d.students.map(s=>row({title:s.name, sub:s.id+" · "+s.ec+" EC", right:s.grade?s.grade.toFixed(1):'-', badgeHtml: s.grade?undefined:badge('Pending','amber')})).join(''), "Generate Report", "goto('lecturer','lecturer-report')")}
    </div>
  </div>`;
}

function screenLecturerFeedback(){
  const d = DATA.lecturer;
  const critical = d.feedback.filter(f=>f.important).length;
  const avg = (d.feedback.reduce((a,f)=>a+f.rating,0)/d.feedback.length).toFixed(1);
  return `<div class="screen" id="scr-lecturer-feedback">
    ${lecturerTopbar()}
    ${pageHead("Feedback & Tasks")}
    <div class="content">
      ${card("Rating overview", `
        <div style="display:flex;gap:14px;align-items:center;">
          <div style="font-size:30px;font-weight:800;color:var(--navy);">${avg}<span style="font-size:13px;color:var(--text-mute);font-weight:600;"> / 5</span></div>
          <div style="flex:1;display:flex;gap:14px;">
            <div><div style="font-size:9.5px;font-weight:800;color:var(--gray2);letter-spacing:.6px;">TOTAL</div><div style="font-weight:800;color:var(--navy);">${d.feedback.length} responses</div></div>
            <div><div style="font-size:9.5px;font-weight:800;color:var(--red);letter-spacing:.6px;">CRITICAL</div><div style="font-weight:800;color:var(--red);">${critical} unreviewed</div></div>
          </div>
        </div>`)}
      ${card("Student comments", d.feedback.map(f=>row({title:f.student, sub:f.subject+" · "+f.comment, badgeHtml: f.important?badge('Important','red'):badge(f.rating+'/5','blue')})).join(''))}
      ${card("Tasks assigned to students", d.tasksAssigned.map(t=>row({title:t.title, sub:t.student+" · due "+t.due, badgeHtml: t.status==='done'?badge('Mark done','green'):badge('Edit','blue')})).join(''), "+ Assign task", "alert('Demo only')")}
    </div>
  </div>`;
}

function screenLecturerSchedule(){
  const d = DATA.lecturer;
  return `<div class="screen" id="scr-lecturer-schedule">
    ${lecturerTopbar()}
    ${pageHead("Schedule","Upcoming classes")}
    <div class="content">
      ${card("Upcoming classes", d.schedule.map(s=>row({title:s.course, sub:s.day+" · "+s.time, badgeHtml:badge(s.loc, s.loc==='Teams'?'blue':'navy')})).join(''), "+ Add class", "alert('Demo only')")}
    </div>
  </div>`;
}

function screenLecturerReport(){
  const d = DATA.lecturer;
  return `<div class="screen" id="scr-lecturer-report">
    ${topbar({portal:"Lecturer Portal", right:`<button class="icon-btn" onclick="goto('lecturer','lecturer-dashboard')">${I.x}</button>`})}
    ${pageHead("Generate Report")}
    <div class="content">
      <div class="field"><label>Subject</label><select>${d.subjects.map(s=>`<option>${s.code} · ${s.name}</option>`).join('')}</select></div>
      <div class="field"><label>Academic year</label><input value="2025–2026" readonly></div>
      ${card("Grade overview", d.students.map(s=>row({title:s.name, sub:s.id, right:s.grade?s.grade.toFixed(1):'-'})).join(''))}
      ${card("Declaration", `
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text-mute);font-weight:400;text-transform:none;letter-spacing:0;">
          <input type="checkbox" style="width:auto;margin-top:2px;"> I agree to this declaration and confirm the grades above are accurate.
        </label>`)}
      <button class="btn btn-primary" onclick="alert('Demo only: report generated & submitted for validation.')">Sign to confirm</button>
    </div>
  </div>`;
}

/* ============================== STUDENT SCREENS ============================== */
function studentTopbar(){
  return topbar({right:`
    <button class="icon-btn" onclick="goto('student','student-notifications')">${I.bell}<span class="dot-badge"></span></button>
    ${avatarBtn('student')}
  `});
}
function studentExtraSheetItems(){
  return [
    {icon:I.user, label:"Profile", onclick:"goto('student','student-profile')"},
    {icon:I.tasks, label:"Tasks", onclick:"goto('student','student-tasks')"},
    {icon:I.support, label:"Support", onclick:"goto('student','student-support')"},
  ];
}

function screenStudentDashboard(){
  const d = DATA.student;
  return `<div class="screen" id="scr-student-dashboard">
    ${studentTopbar()}
    ${pageHead(`Hi, <span class="greeting-name">${d.profile.name.split(' ')[0]}</span>`, "Here's what's happening with your studies")}
    <div class="content">
      ${statGrid([
        {label:"Avg. Grade", value:d.avgGrade, sub:"Current average"},
        {label:"Credits Earned", value:d.credits, sub:"Of 240 total", accent:"blue"},
        {label:"Courses Passed", value:d.coursesPassed, sub:"Current semester", accent:"green"},
        {label:"Feedback", value:d.feedback, sub:"Unread notifications", accent:"orange"},
      ])}
      ${card("Overall study progress","" +
        `<div class="progress-track"><div class="progress-fill" style="width:${d.progressPct}%"></div></div>
         <div class="progress-label"><span>Started ${d.started}</span><span>${d.progressPct}%</span></div>`)}
      ${card("Recent Grades", d.recentGrades.map(g=>row({title:g.course, sub:g.code+" · "+g.date, right:g.grade.toFixed(1)})).join(''), "View all grades", "goto('student','student-grades')")}
      ${card("Document Checklist", d.checklist.map(c=>row({title:c.name, sub:c.sub, badgeHtml: c.done?badge('Submitted','green'):badge('Missing','red')})).join(''), "View all documents", "goto('student','student-documents')")}
      ${card("Notifications", d.notifications.length? d.notifications.map(n=>row({title:n.title, sub:n.sub, right:null, badgeHtml:`<a class="card-link" style="font-size:11.5px;">${n.action}</a>`})).join('') : emptyState("No notifications yet"), "View all feedback", "goto('student','student-tasks')")}
    </div>
  </div>`;
}

function screenStudentGrades(){
  const d = DATA.student;
  const highest = Math.max(...d.allGrades.filter(g=>g.grade).map(g=>g.grade));
  const pending = d.allGrades.filter(g=>g.grade==null);
  return `<div class="screen" id="scr-student-grades">
    ${studentTopbar()}
    ${pageHead("My Grades")}
    <div class="content">
      ${statGrid([
        {label:"Avg. Grade", value:d.avgGrade, sub:"All semesters"},
        {label:"Highest Grade", value:highest.toFixed(1), sub:"Best result", accent:"green"},
        {label:"Courses Passed", value:d.coursesPassed, sub:"Grade ≥ 5.5", accent:"blue"},
        {label:"Pending", value:pending.length, sub:"Not yet released", accent:"orange"},
      ])}
      ${searchBox("Search course...")}
      ${pending.length?card("Pending Grades", pending.map(g=>row({title:g.course, sub:g.code, badgeHtml:badge('Pending','amber')})).join('')):''}
      ${card("All grades", d.allGrades.map(g=>row({title:g.course, sub:g.code, right:g.grade?g.grade.toFixed(1):'-', badgeHtml: g.grade? undefined : badge('Pending','amber')})).join(''))}
    </div>
  </div>`;
}

function screenStudentSchedule(){
  const d = DATA.student;
  return `<div class="screen" id="scr-student-schedule">
    ${studentTopbar()}
    ${pageHead("My Schedule")}
    <div class="content">
      <div style="display:flex;gap:4px;margin-bottom:14px;">
        ${['Su','Mo','Tu','We','Th','Fr','Sa'].map((d0,i)=>`<div style="flex:1;text-align:center;background:${i===1?'var(--navy)':'#fff'};color:${i===1?'#fff':'var(--text-mute)'};border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:11px;font-weight:700;">${d0}<div style="font-size:13px;margin-top:3px;">${20+i}</div></div>`).join('')}
      </div>
      ${card("Full Schedule 2025-2026", d.schedule.map(s=>row({title:s.course, sub:`${s.code} · ${s.day} ${s.date} · ${s.time}`, badgeHtml: badge(s.loc, s.loc==='Teams'?'blue':'navy')})).join(''), "Show all", "")}
    </div>
  </div>`;
}

function screenStudentProgress(){
  const d = DATA.student;
  const maxG = 10, maxEC = Math.max(...d.semesterEC);
  return `<div class="screen" id="scr-student-progress">
    ${studentTopbar()}
    ${pageHead("My Progress")}
    <div class="content">
      ${statGrid([
        {label:"Total EC", value:d.credits.split('/')[0], sub:"All semesters"},
        {label:"Avg. Grade", value:d.avgGrade, sub:"Current semester", accent:"blue"},
        {label:"Sem 8", value:"Afstuderen", sub:"Current semester", accent:"orange"},
        {label:"Tasks Pending", value:1, sub:"1 deadline missed", accent:"red"},
      ])}
      ${card("Average grade per semester", `
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:6px;">
        ${d.semesterGrades.map((g,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:100%;background:linear-gradient(180deg,var(--blue),var(--navy));border-radius:5px 5px 2px 2px;height:${g/maxG*76}px;"></div>
          <span style="font-size:9.5px;color:var(--text-mute);font-weight:700;">S${i+1}</span>
        </div>`).join('')}
        </div>`)}
      ${card("EC per semester", `
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:6px;">
        ${d.semesterEC.map((e,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:100%;background:${e>0?'var(--orange)':'#EEE'};border-radius:5px 5px 2px 2px;height:${Math.max(e/maxEC*76,4)}px;"></div>
          <span style="font-size:9.5px;color:var(--text-mute);font-weight:700;">${e}</span>
        </div>`).join('')}
        </div>`)}
    </div>
  </div>`;
}

function screenStudentDocuments(){
  const d = DATA.student;
  return `<div class="screen" id="scr-student-documents">
    ${studentTopbar()}
    ${pageHead("My Documents")}
    <div class="content">
      ${card("Document Checklist", d.checklist.map(c=>row({title:c.name, sub:c.sub, badgeHtml:c.done?badge('Submitted','green'):badge('Missing','red')})).join(''), "Upload", "")}
      ${card("Request an official document", `
        <div class="field"><label>Document type</label><select><option>Enrollment Statement</option><option>Grade Transcript</option><option>Propedeuse Certificate</option></select></div>
        <div class="field"><label>Purpose / reason</label><textarea placeholder="e.g. For visa application, bank loan, employer..."></textarea></div>
        <button class="btn btn-primary" onclick="alert('Demo only: request submitted.')">Submit request</button>
      `)}
      ${card("My document requests", d.docRequests.length ? d.docRequests.map(r=>{
        const steps=['Submitted','Processing','Ready','Collected'];
        return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
          <div class="row-title" style="margin-bottom:6px;">${r.type}</div>
          <div class="row-sub" style="margin-bottom:8px;">Requested ${r.date}</div>
          <div style="display:flex;gap:4px;">
          ${steps.map((s,i)=>`<div style="flex:1;text-align:center;">
            <div style="width:20px;height:20px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
              background:${i<r.step?'var(--orange)':'#EEF0F5'};color:${i<r.step?'#fff':'var(--gray2)'};">${i+1}</div>
            <span style="font-size:8.5px;color:var(--text-mute);">${s}</span>
          </div>`).join('')}
          </div>
        </div>`;
      }).join('') : emptyState("No document request yet. Submit one above"))}
    </div>
  </div>`;
}

function screenStudentProfile(){
  const p = DATA.student.profile;
  return `<div class="screen" id="scr-student-profile">
    ${topbar({right:`<button class="icon-btn" onclick="goto('student','student-dashboard')">${I.x}</button>`})}
    <div style="text-align:center;padding:22px 18px 6px;">
      <div class="avatar" style="width:64px;height:64px;font-size:20px;margin:0 auto 10px;">WM</div>
      <div style="font-size:17px;font-weight:800;color:var(--navy);">${p.name}</div>
      <div style="margin-top:5px;">${badge(p.status,'green')} <span style="font-size:11.5px;color:var(--text-mute);margin-left:6px;">${p.year} · ${p.semester}</span></div>
    </div>
    <div class="content">
      ${card("My Profile", [
        ["Program", p.program], ["Student ID", p.studentId], ["Email", p.email],
        ["Cohort", p.cohort], ["Enrollment date", p.enrolled], ["Study advisor", p.advisor],
      ].map(([k,v])=>row({title:k, right:v})).join(''))}
    </div>
  </div>`;
}

function screenStudentTasks(){
  const d = DATA.student.tasks;
  const total=d.length, done=d.filter(t=>t.status==='ontime').length, missed=d.filter(t=>t.status==='missed').length, up=d.filter(t=>t.status==='upcoming').length;
  return `<div class="screen" id="scr-student-tasks">
    ${topbar({right:`<button class="icon-btn" onclick="goto('student','student-dashboard')">${I.x}</button>`})}
    ${pageHead("My Tasks")}
    <div class="content">
      ${statGrid([
        {label:"Total Tasks", value:total, sub:"Afstudeerpakket"},
        {label:"Completed", value:done, sub:"On time", accent:"green"},
        {label:"Missed Deadline", value:missed, sub:"Action required", accent:"red"},
        {label:"Upcoming", value:up, sub:"Next, 01 Jun", accent:"orange"},
      ])}
      ${card("Add new task", `
        <div class="field"><label>Task name</label><input placeholder="Review chapter 3..."></div>
        <div class="field"><label>Description (optional)</label><textarea placeholder="Add details..."></textarea></div>
        <div class="field"><label>Deadline</label><input type="date"></div>
        <button class="btn btn-primary" onclick="alert('Demo only: task added.')">Add task</button>
      `)}
      ${card("Tasks", d.map(t=>row({title:t.name, sub:t.course+" · due "+t.due, badgeHtml:gradeBadge(t.status)})).join(''))}
    </div>
  </div>`;
}

function screenStudentSupport(){
  return `<div class="screen" id="scr-student-support">
    ${topbar({right:`<button class="icon-btn" onclick="goto('student','student-dashboard')">${I.x}</button>`})}
    ${pageHead("Contacts & Support","Who to contact and answers to common questions")}
    <div class="content">
      ${searchBox("Search by name or department...")}
      ${card("Contact Directory", [
        {n:"Front Office", s:"General questions · Mon–Fri 08:00–16:00"},
        {n:"Finance Department", s:"Payments & clearance"},
        {n:"Study Advisor", s:"Program & progress guidance"},
      ].map(c=>row({title:c.n, sub:c.s, badgeHtml:`<span class="chevron">${I.mail}</span>`})).join(''))}
      ${card("Frequently Asked Questions", [
        "How do I request a document?","When are grades published?","How do I set up a payment plan?"
      ].map(q=>row({title:q, badgeHtml:`<span class="chevron">▾</span>`})).join(''))}
    </div>
  </div>`;
}

function screenStudentNotifications(){
  const d = DATA.student.notifications;
  return `<div class="screen" id="scr-student-notifications">
    ${topbar({right:`<button class="icon-btn" onclick="goto('student','student-dashboard')">${I.x}</button>`})}
    ${pageHead("Notifications")}
    <div class="content">
      ${card("All notifications", d.length? d.map(n=>row({title:n.title, sub:n.sub, badgeHtml:`<a class="card-link" style="font-size:11.5px;">${n.action}</a>`})).join('') : emptyState("No notifications yet"))}
    </div>
  </div>`;
}
</script>
